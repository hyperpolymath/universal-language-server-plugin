version: 2

multi-ecosystem-groups:
  js-locks:
    schedule:
      interval: "weekly"
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    # `open-pull-requests-limit: 0` suppresses routine version-update PRs
    # while leaving Dependabot SECURITY PRs flowing. The previous
    # `ignore: "*" patch` rule also silenced security PRs under GitHub\'s
    # current Dependabot behaviour. See rsr-template-repo commit 78b050e
    # and 007-lang/audits/audit-dependabot-automation-gap-2026-04-17.md.
    open-pull-requests-limit: 3
    groups:
      cargo:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      all-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "nix"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      all-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/"
    multi-ecosystem-group: "js-locks"
    patterns: ["*"]
    open-pull-requests-limit: 3

  # Bun (bun.lock): in the js-locks group with npm, so one PR moves pnpm-lock.yaml and bun.lock together
  - package-ecosystem: "bun"
    directory: "/"
    multi-ecosystem-group: "js-locks"
    patterns: ["*"]
    open-pull-requests-limit: 3
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      all-dependencies:
        patterns:
          - "*"
